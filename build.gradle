apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

ext {
    mindustryVersion = "v160"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories {
    mavenCentral()

    ivy {
        url = 'https://github.com/'
        patternLayout {
            artifact('/[organisation]/[module]/releases/download/[revision]/dependencies.jar')
        }
        metadataSources { artifact() }
        content {
            includeVersion("Anuken", "Mindustry", mindustryVersion)
        }
    }
}

java {
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly "Anuken:Mindustry:$mindustryVersion"
}

tasks.register('jarAndroid') {
    dependsOn "jar"
    def projectName = project.name

    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException("No valid Android SDK found. Ensure ANDROID_HOME is set.")
        }

        def platformRoot = new File("$sdkRoot/platforms/").listFiles()
            .sort()
            .reverse()
            .find { f -> new File(f, "android.jar").exists() }

        if (!platformRoot) {
            throw new GradleException("No Android platform installed in the SDK.")
        }

        def classpath = (
            configurations.compileClasspath.asList() +
            configurations.runtimeClasspath.asList() +
            [new File(platformRoot, "android.jar")]
        ).collect { "--classpath $it.path" }.join(" ")

        def d8 = isWindows ? "d8.bat" : "d8"
        def command = "$d8 $classpath --min-api 21 --output ${projectName}Android.jar ${projectName}Desktop.jar"

        command.execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar {
    archiveFileName = "${project.name}Desktop.jar"

    from(projectDir) {
        include "mod.hjson"
    }

    from("assets/") {
        include "**"
    }
}

tasks.register('deploy', Jar) {
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"

    from {
        [
            zipTree("build/libs/${projectName}Desktop.jar"),
            zipTree("build/libs/${projectName}Android.jar")
        ]
    }

    doLast {
        delete "build/libs/${projectName}Android.jar"
    }
}
