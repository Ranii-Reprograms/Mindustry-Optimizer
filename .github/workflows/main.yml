name: Build Mindustry Optimizer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
          echo "$ANDROID_HOME/build-tools/30.0.3" >> "$GITHUB_PATH"

      - name: Build Android-compatible mod JAR
        run: gradle clean deploy

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-Optimizer-Android
          path: build/libs/Mindustry-Optimizer.jar
